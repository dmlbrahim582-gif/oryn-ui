<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oryn AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #161616;
            border-bottom: 1px solid #262626;
            font-size: 15px;
            font-weight: 600;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }
        .settings-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }
        .settings-btn:hover {
            color: #fff;
        }

        /* Chat Container - Full Screen */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 15px;
        }
        .user-msg {
            background-color: #262626;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e5e5e5;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            width: 100%;
            max-width: 100%;
        }
        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* Code Blocks Styling */
        .code-box {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 6px;
            margin: 10px 0;
            overflow: hidden;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f1f1f;
            padding: 6px 12px;
            font-size: 12px;
            color: #aaa;
            border-bottom: 1px solid #333;
        }
        .copy-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .copy-btn:hover {
            background: #444;
        }
        pre {
            margin: 0;
            padding: 12px;
            overflow-x: auto;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #38bdf8;
        }
        code {
            font-family: Consolas, Monaco, monospace;
        }

        /* Input Area - Full Width Bottom */
        .input-container {
            background-color: #161616;
            border-top: 1px solid #262626;
            padding: 16px 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .preview-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preview-thumb {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .preview-thumb img, .preview-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-thumb button {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            padding: 12px;
            background-color: #202020;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            max-height: 150px;
            line-height: 1.4;
        }
        textarea::placeholder {
            color: #777;
        }
        button.action-btn {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background-color: #ffffff;
        }
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #777;
        }
        .edit-link {
            background: none;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
        .edit-link:hover {
            text-decoration: underline;
        }

        /* Modal for Settings / Token */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content input {
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <span>Oryn AI</span>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Online</span>
            </div>
            <button class="settings-btn" onclick="toggleSettings(true)" title="Settings">⚙️</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Container -->
    <div class="input-container">
        <div class="preview-area" id="previewArea"></div>
        <div class="input-row">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" multiple onchange="handleFiles(this.files)">
            <button class="action-btn" type="button" onclick="document.getElementById('mediaInput').click()">+</button>
            <textarea id="userInput" placeholder="Type a message..." rows="1" oninput="autoResize(this)"></textarea>
            <button class="action-btn" onclick="sendMessage()">Send</button>
        </div>
        <div class="tools-row">
            <span>Secure Client-Side Chat</span>
            <button id="editBtn" class="edit-link" style="display: none;" onclick="editLastUserMessage()">Edit last message</button>
        </div>
    </div>

    <!-- Settings Modal for Secure Token Storage -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>API Settings</h3>
            <p style="font-size: 13px; color: #aaa; margin: 0;">Enter your Hugging Face Token. It is stored securely in your browser's local storage and never exposed in the source code.</p>
            <input type="password" id="tokenInput" placeholder="hf_xxxxxxxxxxxxxxxxxxxxx">
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
                <button class="action-btn" style="padding: 6px 12px; font-size: 13px;" onclick="toggleSettings(false)">Cancel</button>
                <button class="action-btn" style="padding: 6px 12px; font-size: 13px; background: #38bdf8; color: #000;" onclick="saveToken()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let attachedFiles = [];
        let lastUserMessageText = "";
        let lastUserMessageMedia = [];

        // Check if token exists on load, if not open settings
        window.onload = function() {
            const savedToken = localStorage.getItem('hf_token');
            if (!savedToken) {
                toggleSettings(true);
            }
        };

        function toggleSettings(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
            if (show) {
                document.getElementById('tokenInput').value = localStorage.getItem('hf_token') || '';
            }
        }

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (token) {
                localStorage.setItem('hf_token', token);
                toggleSettings(false);
                alert('Token saved securely in your browser!');
            } else {
                alert('Please enter a valid token.');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleFiles(files) {
            for (let file of files) {
                attachedFiles.push(file);
            }
            renderPreviews();
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const area = document.getElementById('previewArea');
            area.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'preview-thumb';
                const url = URL.createObjectURL(file);
                
                if (file.type.startsWith('image/')) {
                    div.innerHTML = `<img src="${url}"><button onclick="removeFile(${index})">×</button>`;
                } else if (file.type.startsWith('video/')) {
                    div.innerHTML = `<video src="${url}"></video><button onclick="removeFile(${index})">×</button>`;
                }
                area.appendChild(div);
            });
        }

        function formatMessageContent(text) {
            // Escape HTML to prevent injection
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Format code blocks ```code```
            safeText = safeText.replace(/```([\s\S]*?)```/g, (match, code) => {
                return `<div class="code-box">
                    <div class="code-header"><span>Code Block</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
                    <pre><code>${code.trim()}</code></pre>
                </div>`;
            });

            // Format inline code `code`
            safeText = safeText.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Line breaks
            return safeText.replace(/\n/g, '<br>');
        }

        function copyCode(btn) {
            const codeText = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(codeText);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
        }

        function appendMessage(text, sender, mediaList = []) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            let content = text ? `<div>${formatMessageContent(text)}</div>` : '';
            
            if (mediaList && mediaList.length > 0) {
                mediaList.forEach(file => {
                    const url = URL.createObjectURL(file);
                    if (file.type.startsWith('image/')) {
                        content += `<img src="${url}">`;
                    } else if (file.type.startsWith('video/')) {
                        content += `<video src="${url}" controls></video>`;
                    }
                });
            }
            
            msgDiv.innerHTML = content;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const token = localStorage.getItem('hf_token');
            if (!token) {
                alert('Please set your Hugging Face Token in the settings (⚙️) first.');
                toggleSettings(true);
                return;
            }

            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text && attachedFiles.length === 0) return;

            lastUserMessageText = text;
            lastUserMessageMedia = [...attachedFiles];

            appendMessage(text, 'user', attachedFiles);
            document.getElementById('editBtn').style.display = 'inline-block';

            input.value = '';
            input.style.height = 'auto';
            attachedFiles = [];
            renderPreviews();

            // Update status indicator to working
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            statusDot.style.backgroundColor = '#eab308'; // Yellow for loading
            statusText.textContent = 'Generating...';

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/teamcognilabs/oryn-v1", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: text })
                });

                const data = await response.json();
                
                let aiReply = "Received empty response.";
                if (Array.isArray(data) && data.length > 0) {
                    aiReply = data[0].generated_text || data[0].text || JSON.stringify(data);
                } else if (data.generated_text) {
                    aiReply = data.generated_text;
                } else if (data.error) {
                    aiReply = "Error from model: " + data.error;
                }

                appendMessage(aiReply, 'ai');
                statusDot.style.backgroundColor = '#22c55e';
                statusText.textContent = 'Online';

            } catch (error) {
                appendMessage('An error occurred while connecting to the model.', 'ai');
                statusDot.style.backgroundColor = '#ef4444';
                statusText.textContent = 'Error';
            }
        }

        function editLastUserMessage() {
            if (!lastUserMessageText && lastUserMessageMedia.length === 0) return;
            
            const input = document.getElementById('userInput');
            input.value = lastUserMessageText;
            autoResize(input);

            attachedFiles = [...lastUserMessageMedia];
            renderPreviews();

            document.getElementById('editBtn').style.display = 'none';
        }
    </script>
</body>
</html>
