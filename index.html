<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 15px;
        }
        .user-msg {
            background-color: #2b2b2b;
            color: #ffffff;
            align-self: flex-end;
        }
        .ai-msg {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            color: #e0e0e0;
            align-self: flex-start;
        }
        .message img, .message video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            display: block;
        }
        .input-container {
            background-color: #181818;
            border-top: 1px solid #333333;
            padding: 12px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .preview-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preview-thumb {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .preview-thumb img, .preview-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-thumb button {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            padding: 10px;
            background-color: #242424;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 6px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            max-height: 120px;
            line-height: 1.4;
        }
        textarea::placeholder {
            color: #888;
        }
        button.action-btn {
            background-color: #ffffff;
            color: #121212;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button.action-btn:active {
            background-color: #cccccc;
        }
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #888;
        }
        .edit-link {
            background: none;
            border: none;
            color: #4da6ff;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-container">
        <div class="preview-area" id="previewArea"></div>
        <div class="input-row">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" multiple onchange="handleFiles(this.files)">
            <button class="action-btn" type="button" onclick="document.getElementById('mediaInput').click()">+</button>
            <textarea id="userInput" placeholder="Type a message..." rows="1" oninput="autoResize(this)"></textarea>
            <button class="action-btn" onclick="sendMessage()">Send</button>
        </div>
        <div class="tools-row">
            <span id="statusInfo">Ready</span>
            <button id="editBtn" class="edit-link" style="display: none;" onclick="editLastUserMessage()">Edit last message</button>
        </div>
    </div>

    <script>
        let attachedFiles = [];
        let lastUserMessageText = "";
        let lastUserMessageMedia = [];

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleFiles(files) {
            for (let file of files) {
                attachedFiles.push(file);
            }
            renderPreviews();
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const area = document.getElementById('previewArea');
            area.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'preview-thumb';
                const url = URL.createObjectURL(file);
                
                if (file.type.startsWith('image/')) {
                    div.innerHTML = `<img src="${url}"><button onclick="removeFile(${index})">×</button>`;
                } else if (file.type.startsWith('video/')) {
                    div.innerHTML = `<video src="${url}"></video><button onclick="removeFile(${index})">×</button>`;
                }
                area.appendChild(div);
            });
        }

        function appendMessage(text, sender, mediaList = []) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            let content = text ? `<div>${text.replace(/\n/g, '<br>')}</div>` : '';
            
            if (mediaList && mediaList.length > 0) {
                mediaList.forEach(file => {
                    const url = URL.createObjectURL(file);
                    if (file.type.startsWith('image/')) {
                        content += `<img src="${url}">`;
                    } else if (file.type.startsWith('video/')) {
                        content += `<video src="${url}" controls></video>`;
                    }
                });
            }
            
            msgDiv.innerHTML = content;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text && attachedFiles.length === 0) return;

            // Save the last version for later editing
            lastUserMessageText = text;
            lastUserMessageMedia = [...attachedFiles];

            // Display user message in chat
            appendMessage(text, 'user', attachedFiles);

            // Enable edit last message button
            document.getElementById('editBtn').style.display = 'inline-block';

            // Clear input fields
            input.value = '';
            input.style.height = 'auto';
            attachedFiles = [];
            renderPreviews();

            // Connection status
            const statusInfo = document.getElementById('statusInfo');
            statusInfo.textContent = 'Generating...';

            try {
                // Simulate response (you can replace this part with your API connection)
                setTimeout(() => {
                    const aiReply = "This is a dummy response from the model. You can connect this to your API endpoint to receive real responses.";
                    appendMessage(aiReply, 'ai');
                    statusInfo.textContent = 'Ready';
                }, 1000);

                /* Example for future API connection:
                const response = await fetch("https://api-inference.huggingface.co/models/YOUR_MODEL_NAME", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer YOUR_HF_TOKEN",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: text })
                });
                const data = await response.json();
                appendMessage(data[0]?.generated_text || "Received", 'ai');
                */

            } catch (error) {
                appendMessage('An error occurred while connecting to the model.', 'ai');
                statusInfo.textContent = 'Connection error';
            }
        }

        function editLastUserMessage() {
            if (!lastUserMessageText && lastUserMessageMedia.length === 0) return;
            
            // Restore old text to input box
            const input = document.getElementById('userInput');
            input.value = lastUserMessageText;
            autoResize(input);

            // Restore attached media if any
            attachedFiles = [...lastUserMessageMedia];
            renderPreviews();

            // Hide the button temporarily until the new edit is sent
            document.getElementById('editBtn').style.display = 'none';
        }
    </script>
</body>
  </html>
